# Verify every pull request before it reaches main: the same hashira static-webapp
# CI that deploy.yml runs on push (build, npm test with coverage, scan suite), plus
# the Python pipeline tests, which neither hashira flow runs.
#
# The pinned hashira ref must match deploy.yml's, so a PR is checked exactly the
# way main will be built.
name: pr
on:
  pull_request:

permissions: {}

jobs:
  ci:
    uses: skathio/hashira/.github/workflows/static-webapp-ci.yml@e4facc4ca8d8896285931a3b80a1a958584d1a85
    permissions:
      contents: read
      id-token: write
      pages: write
      pull-requests: write
      security-events: write
    with:
      node_version: "22"
      build_command: "npm run build"
      output_dir: "dist"
      test_command: "npm test"
      coverage_path: "coverage/lcov.info"
      library_ref: "e4facc4ca8d8896285931a3b80a1a958584d1a85"

  pipeline:
    # The pipeline is stdlib-only Python, so the runner's own python3 is enough: no
    # setup action, no dependencies to install.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Python pipeline tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
